# SDS Traduction — configuration Cloudflare (aucune base à créer)
name = "sds-traduction"
main = "worker.js"
compatibility_date = "2025-09-01"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "REG"
class_name = "Registry"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Registry"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby"]

[observability]
enabled = true
